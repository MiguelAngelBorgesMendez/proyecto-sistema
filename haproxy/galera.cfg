global
    log stdout format raw local0
    external-check preserve-env
    insecure-fork-wanted

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

frontend galera_mysql
    bind *:3306
    default_backend galera_nodes

backend galera_nodes
    balance leastconn
    option external-check
    external-check path /usr/local/bin:/usr/bin:/bin
    external-check command /usr/local/bin/galera-check.sh
    server galera1 galera1:3306 check inter 2s fall 3 rise 2
    server galera2 galera2:3306 check inter 2s fall 3 rise 2
    server galera3 galera3:3306 check inter 2s fall 3 rise 2

listen galera_stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
